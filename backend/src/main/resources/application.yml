spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tool66db}
    username: ${DB_USER:tool66user}
    password: ${DB_PASSWORD:tool66pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 600000
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@tool66.local}
    password: ${MAIL_PASSWORD:placeholder}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:changeme-super-secret-key-at-least-32-chars!!}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

app:
  mail-enabled: ${MAIL_ENABLED:false}
  enable-demo-seed: ${ENABLE_DEMO_SEED:false}
  ai-service-url: ${AI_SERVICE_URL:http://ai-service:5000}
  ai-service-timeout-seconds: 10
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:Admin@1234}
  admin-email: ${ADMIN_EMAIL:admin@tool66.local}

logging:
  level:
    com.internship.tool: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
